<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0f172a" />
<title>错词本背单词</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<style>
  :root{
    --bg:#f5f7fb; --panel:#ffffff; --ink:#1e293b; --muted:#64748b; --line:#e2e8f0;
    --primary:#4f46e5; --primary-d:#4338ca; --accent:#0ea5e9; --ok:#16a34a; --warn:#f59e0b; --bad:#ef4444;
    --radius:16px; --shadow:0 6px 20px rgba(15,23,42,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:linear-gradient(135deg,#4f46e5,#0ea5e9);color:#fff;box-shadow:var(--shadow)}
  .brand{font-weight:800;font-size:18px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
  .lib-indicator{font-size:13px;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:999px;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .layout{display:flex;min-height:calc(100% - 56px)}
  /* PC 侧边栏 */
  .sidebar{width:200px;flex:0 0 200px;background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:6px}
  .sidebar .nav-btn{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;border:none;background:transparent;color:var(--ink);font-size:15px;font-weight:600;cursor:pointer;text-align:left;width:100%}
  .sidebar .nav-btn .ico{font-size:18px}
  .sidebar .nav-btn.active{background:var(--primary);color:#fff}
  .sidebar .nav-btn:hover:not(.active){background:#eef2ff}
  .sidebar .spacer{flex:1}
  .sidebar .hint{font-size:11px;color:var(--muted);padding:8px 12px;line-height:1.5}
  main{flex:1;padding:18px;max-width:920px;margin:0 auto;width:100%}
  .view{display:none}
  .view.active{display:block;animation:fade .2s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
  .card h2{margin:0 0 14px;font-size:18px}
  .card h3{margin:18px 0 10px;font-size:15px;color:var(--muted)}
  .muted{color:var(--muted)}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .grow{flex:1}
  input[type=text],input[type=number],select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;color:var(--ink);font-family:inherit}
  textarea{min-height:120px;resize:vertical}
  label{font-size:13px;color:var(--muted);display:block;margin:10px 0 4px;font-weight:600}
  .btn{border:none;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer;background:var(--primary);color:#fff;transition:.15s}
  .btn:hover{background:var(--primary-d)}
  .btn.ghost{background:#eef2ff;color:var(--primary)}
  .btn.ghost:hover{background:#e0e7ff}
  .btn.ok{background:var(--ok)}
  .btn.warn{background:var(--warn)}
  .btn.bad{background:var(--bad)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .lib-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;position:relative}
  .lib-card:hover{transform:translateY(-2px);border-color:var(--primary)}
  .lib-card .name{font-weight:800;font-size:16px;margin-bottom:6px}
  .lib-card .meta{font-size:12px;color:var(--muted)}
  .lib-card .del{position:absolute;top:8px;right:8px;border:none;background:#fee2e2;color:var(--bad);border-radius:8px;width:26px;height:26px;cursor:pointer;font-weight:700}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px;user-select:none}
  .chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
  .seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .seg button{flex:1;border:none;background:#fff;padding:11px;font-size:14px;font-weight:700;cursor:pointer;color:var(--muted)}
  .seg button.on{background:var(--primary);color:#fff}
  /* 背诵页 */
  .study-word{font-size:46px;font-weight:800;text-align:center;margin:24px 0 8px;word-break:break-word;line-height:1.2}
  .study-sub{text-align:center;color:var(--muted);font-size:16px;margin-bottom:18px}
  .progress{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:14px 0}
  .progress > i{display:block;height:100%;background:linear-gradient(90deg,#4f46e5,#0ea5e9);width:0;transition:.25s}
  .study-actions{display:flex;gap:12px;margin-top:18px}
  .study-actions .btn{flex:1;padding:18px;font-size:18px}
  .detail{background:#fff7ed;border:1px solid #fed7aa;border-radius:14px;padding:16px;margin-top:16px;display:none}
  .detail.show{display:block;animation:fade .2s ease}
  .detail .ex-en{font-weight:700;font-size:17px}
  .detail .ex-cn{color:var(--muted);margin-top:4px}
  .summary{text-align:center;padding:10px 0}
  .summary .big{font-size:40px;font-weight:800}
  /* 统计 */
  .stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:8px}
  .stat{background:linear-gradient(135deg,#eef2ff,#f0f9ff);border-radius:14px;padding:16px;text-align:center}
  .stat .n{font-size:28px;font-weight:800;color:var(--primary)}
  .stat .t{font-size:12px;color:var(--muted);margin-top:4px}
  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-size:12px;font-weight:700}
  tr:hover td{background:#f8fafc}
  .bar{height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--bad)}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:#fee2e2;color:var(--bad);font-weight:700}
  .empty{text-align:center;color:var(--muted);padding:40px 10px}
  /* 底部导航（手机） */
  .bottombar{display:none}
  .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #print-root{display:none}
  @media (max-width:760px){
    .sidebar{display:none}
    .bottombar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(15,23,42,.08)}
    .bottombar .nav-btn{flex:1;border:none;background:transparent;padding:10px 4px;font-size:11px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:700}
    .bottombar .nav-btn .ico{font-size:20px}
    .bottombar .nav-btn.active{color:var(--primary)}
    main{padding:14px 14px 84px}
    .study-word{font-size:38px}
  }
  @media print{
    .topbar,.sidebar,.bottombar,main,.toast{display:none !important}
    #print-root{display:block !important;padding:0}
    #print-root .pv{font-family:"Microsoft YaHei",sans-serif;color:#000}
    #print-root h1{font-size:20px;margin:0 0 4px}
    #print-root .pm{color:#444;font-size:12px;margin-bottom:12px}
    #print-root table{width:100%;border-collapse:collapse;font-size:13px}
    #print-root th,#print-root td{border:1px solid #999;padding:5px 7px}
    #print-root th{background:#eee}
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">📘 错词本背单词</div>
    <div id="libIndicator" class="lib-indicator">未选择词库</div>
  </header>

  <div class="layout">
    <nav class="sidebar">
      <button class="nav-btn" data-view="libraries"><span class="ico">📚</span> 词库</button>
      <button class="nav-btn" data-view="settings"><span class="ico">🎯</span> 背诵</button>
      <button class="nav-btn" data-view="stats"><span class="ico">📊</span> 统计</button>
      <button class="nav-btn" data-view="manage"><span class="ico">🖥️</span> 管理/打印</button>
      <div class="spacer"></div>
      <div class="hint">手机：加到桌面即用 · 电脑：导入/导出/打印。数据存本机，跨设备用「导出/导入」同步。</div>
    </nav>

    <main>
      <!-- 词库列表 -->
      <section class="view" id="view-libraries">
        <div class="card">
          <h2>我的词库</h2>
          <div class="row" style="margin-bottom:14px">
            <button class="btn" id="goImportBtn">＋ 导入新词库</button>
            <button class="btn ghost" id="loadSampleBtn">载入示例词库</button>
          </div>
          <div id="libGrid" class="lib-grid"></div>
          <div id="libEmpty" class="empty">还没有词库，点「导入新词库」或「载入示例词库」开始。</div>
        </div>
      </section>

      <!-- 背诵设置 -->
      <section class="view" id="view-settings">
        <div class="card">
          <h2>背诵设置</h2>
          <div id="setLibName" class="muted" style="margin-bottom:8px"></div>
          <label>选择分组范围（不选 = 全部）</label>
          <div class="row" style="gap:8px;margin:2px 0 10px">
            <button class="btn ghost" id="chipsAll" style="padding:6px 14px;font-size:13px">全选</button>
            <button class="btn ghost" id="chipsNone" style="padding:6px 14px;font-size:13px">清空</button>
            <span class="muted" id="chipsCount" style="font-size:13px;align-self:center"></span>
          </div>
          <div id="groupChips" class="row"></div>
          <label>学习范围</label>
          <div class="seg" id="segMode">
            <button data-v="all" class="on">全部背诵</button>
            <button data-v="wrong">仅错词</button>
          </div>
          <label>记忆顺序</label>
          <div class="seg" id="segSort">
            <button data-v="order" class="on">顺序</button>
            <button data-v="random">随机打乱</button>
          </div>
          <label>记忆模式</label>
          <div class="seg" id="segMem">
            <button data-v="en" class="on">记英文（看英文答中文）</button>
            <button data-v="cn">记中文（看中文答英文）</button>
          </div>
          <label>发音口音（真人发音）</label>
          <div class="seg" id="segAccent">
            <button data-v="us" class="on">美式 🇺🇸</button>
            <button data-v="uk">英式 🇬🇧</button>
          </div>
          <label>声线（无真人音时合成兜底）</label>
          <div class="seg" id="segVoice">
            <button data-v="female" class="on">女声</button>
            <button data-v="male">男声</button>
            <button data-v="default">系统默认</button>
          </div>
          <div class="row" style="margin-top:18px">
            <button class="btn grow" id="startStudyBtn" style="padding:16px">开始背诵 ▶</button>
          </div>
        </div>
      </section>

      <!-- 背诵页 -->
      <section class="view" id="view-study">
        <div class="card">
          <div id="studyHead" class="muted" style="display:flex;justify-content:space-between"></div>
          <div class="progress"><i id="studyBar"></i></div>
          <div id="studyBody"></div>
        </div>
      </section>

      <!-- 统计 -->
      <section class="view" id="view-stats">
        <div class="card">
          <h2>学习统计</h2>
          <div id="statCards" class="stat-cards"></div>
          <h3>各分组错误情况</h3>
          <div id="statGroups"></div>
          <h3>错词排行榜（Top 10）</h3>
          <div id="statRank"></div>
        </div>
      </section>

      <!-- 管理 / 导入导出打印 -->
      <section class="view" id="view-manage">
        <div class="card">
          <h2>① 导入词库（电脑端）</h2>
          <label>词库名称</label>
          <input type="text" id="impName" placeholder="例如：中考1600词" />
          <label>上传文件（.xlsx / .xls / .csv / .txt）或粘贴文本</label>
          <input type="file" id="impFile" accept=".xlsx,.xls,.csv,.txt" />
          <div class="row" style="margin-top:8px">
            <button class="btn ghost" id="impFileBtn" style="flex:1">选择文件并导入</button>
          </div>
          <details style="margin-top:12px">
            <summary class="muted" style="cursor:pointer">或粘贴文本（每行一条，支持 中考1600词4列 / 通用 英文,中文 两列）</summary>
            <textarea id="impText" placeholder="Unit1	1	hair	n. 头发&#10;Unit1	2	television	n. 电视&#10;（也可直接贴：hello,你好）"></textarea>
            <div class="row" style="margin-top:8px">
              <button class="btn" id="impPasteBtn" style="flex:1">从粘贴文本导入</button>
            </div>
          </details>
          <div id="impMsg" class="muted" style="margin-top:10px"></div>
        </div>

        <div class="card">
          <h2>② 导出数据</h2>
          <div class="row">
            <div class="grow">
              <label>词库</label>
              <select id="expLib"></select>
            </div>
            <div class="grow">
              <label>格式</label>
              <select id="expFmt"><option value="csv">CSV</option><option value="json">JSON</option></select>
            </div>
          </div>
          <div class="row" style="margin-top:6px">
            <div class="grow">
              <label>范围</label>
              <select id="expScope"><option value="all">全部</option><option value="wrong">仅错词</option></select>
            </div>
            <div class="grow">
              <label>排序</label>
              <select id="expSort"><option value="order">按词序</option><option value="error">按错误数</option><option value="group">按分组</option></select>
            </div>
          </div>
          <div class="row" style="margin-top:12px">
            <button class="btn grow" id="expBtn" style="padding:14px">⬇ 导出下载</button>
          </div>
        </div>

        <div class="card">
          <h2>③ 打印 / 导出 PDF</h2>
          <div class="row">
            <div class="grow">
              <label>词库</label>
              <select id="prtLib"></select>
            </div>
            <div class="grow">
              <label>范围</label>
              <select id="prtScope"><option value="all">全部单词</option><option value="wrong">仅错词</option></select>
            </div>
          </div>
          <div class="row" style="margin-top:12px">
            <button class="btn grow" id="prtBtn" style="padding:14px">🖨 打印 / 存为 PDF</button>
          </div>
          <div class="muted" style="margin-top:8px;font-size:12px">提示：打印对话框里选「目标 = 另存为 PDF」即可导出 PDF。</div>
        </div>

        <div class="card">
          <h2>④ 数据看板</h2>
          <div class="row" style="margin-bottom:10px">
            <div class="grow"><label>选择词库</label><select id="dashLib"></select></div>
          </div>
          <div id="dashBody"></div>
        </div>
      </section>
    </main>
  </div>

  <nav class="bottombar">
    <button class="nav-btn" data-view="libraries"><span class="ico">📚</span>词库</button>
    <button class="nav-btn" data-view="settings"><span class="ico">🎯</span>背诵</button>
    <button class="nav-btn" data-view="stats"><span class="ico">📊</span>统计</button>
    <button class="nav-btn" data-view="manage"><span class="ico">🖥️</span>管理</button>
  </nav>

  <div id="toast" class="toast"></div>
  <div id="print-root"></div>

  <script src="libs/xlsx.full.min.js"></script>
  <script src="core.js"></script>
  <script src="mespeak/mespeak.js"></script>
  <script>
  "use strict";
  /* ============ 数据层（IndexedDB） ============ */
  const DB_NAME='vocab_pwa', DB_VER=1;
  let _db=null;
  function openDB(){return new Promise((res,rej)=>{if(_db)return res(_db);const r=indexedDB.open(DB_NAME,DB_VER);r.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains('libraries'))db.createObjectStore('libraries',{keyPath:'id'});if(!db.objectStoreNames.contains('words')){const s=db.createObjectStore('words',{keyPath:'id'});s.createIndex('libraryId','libraryId',{unique:false});}if(!db.objectStoreNames.contains('progress'))db.createObjectStore('progress',{keyPath:'wordId'});};r.onsuccess=e=>{_db=e.target.result;res(_db);};r.onerror=e=>rej(r.error);});}
  function reqP(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
  function store(name,mode){return openDB().then(db=>db.transaction(name,mode).objectStore(name));}
  async function putLib(lib){const s=await store('libraries','readwrite');return reqP(s.put(lib));}
  async function getLibs(){const s=await store('libraries','readonly');const a=await reqP(s.getAll());a.sort((x,y)=>x.createdAt-y.createdAt);return a;}
  async function getLib(id){const s=await store('libraries','readonly');return reqP(s.get(id));}
  async function addWords(libraryId,records){const db=await openDB();const os=db.transaction('words','readwrite').objectStore('words');const ps=records.map((r,i)=>{const id=(crypto.randomUUID?crypto.randomUUID():('w_'+Date.now()+'_'+i));return reqP(os.put(Object.assign({id,libraryId,importedAt:Date.now()},r)));});await Promise.all(ps);}
  async function getWords(libraryId){const db=await openDB();return reqP(db.transaction('words','readonly').objectStore('words').index('libraryId').getAll(libraryId));}
  async function getProgressForLib(libId){const s=await store('progress','readonly');const all=await reqP(s.getAll());return all.filter(p=>p.libraryId===libId);}
  async function bumpProgress(wordId,libraryId,delta){const db=await openDB();const os=db.transaction('progress','readwrite').objectStore('progress');const cur=await reqP(os.get(wordId));let rec=cur||{wordId,libraryId,error_count:0,last_error_time:null,is_reviewed:false};rec.error_count=(rec.error_count||0)+delta;if(rec.error_count<0)rec.error_count=0;rec.last_error_time=Date.now();await reqP(os.put(rec));return rec.error_count;}
  async function clearProgress(libId){const db=await openDB();const ps=db.transaction('progress','readwrite').objectStore('progress');const all=await reqP(ps.getAll());await Promise.all(all.filter(p=>p.libraryId===libId).map(p=>reqP(ps.delete(p.wordId))));}
  async function deleteLib(id){const db=await openDB();await reqP(db.transaction('libraries','readwrite').objectStore('libraries').delete(id));const ws=db.transaction('words','readwrite').objectStore('words');const keys=await reqP(ws.index('libraryId').getAllKeys(id));await Promise.all(keys.map(k=>reqP(ws.delete(k))));const ps=db.transaction('progress','readwrite').objectStore('progress');const all=await reqP(ps.getAll());await Promise.all(all.filter(p=>p.libraryId===id).map(p=>reqP(ps.delete(p.wordId))));}

  /* ============ 全局状态 ============ */
  // 声线偏好（仅作用于无真人音时的合成兜底）：female（女声，默认）/ male（男声）/ default（系统默认）
  let voicePref=(function(){try{const v=localStorage.getItem('vocab_voice_pref');return (v==='female'||v==='male'||v==='default')?v:'female';}catch(e){return 'female';}})();
  // 发音口音偏好（真人音）：us（美式，默认）/ uk（英式）
  let accentPref=(function(){try{const v=localStorage.getItem('vocab_accent');return (v==='us'||v==='uk')?v:'us';}catch(e){return 'us';}})();
  // 真人发音清单（audio/manifest.json）：{ wordKey: {us:bool, uk:bool} }
  let audioManifest=null;
  const state={curLibId:null,study:null,groups:[]};

  /* ============ 工具 ============ */
  function $(s){return document.querySelector(s);}
  function $all(s){return Array.from(document.querySelectorAll(s));}
  function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600);}
  function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
  function uid(p){return (crypto.randomUUID?crypto.randomUUID():(p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2)));}

  /* ============ 语音播报（移动端健壮版 + meSpeak 兜底） ============ */
  let _voices=[], _audioUnlocked=false, _curUtter=null, msEnReady=false;
  // —— meSpeak：纯 JS 离线 TTS，不依赖浏览器自带语音，荣耀/百度等浏览器也可用 ——
  function initMeSpeak(){
    if(typeof meSpeak==='undefined')return;
    try{
      meSpeak.loadConfig('mespeak/mespeak_config.json');
      meSpeak.loadVoice('mespeak/voices/en/en.json', function(){ msEnReady=true; });
    }catch(e){}
  }
  initMeSpeak();
  function loadVoices(){
    try{ _voices=window.speechSynthesis.getVoices()||[]; }catch(e){ _voices=[]; }
  }
  if('speechSynthesis'in window){
    loadVoices();
    window.speechSynthesis.onvoiceschanged=loadVoices;
  }
  function pickVoice(lang,gender){
    if(!_voices||!_voices.length)return null;
    const target=(lang||'en-US');
    const base=target.split('-')[0].toLowerCase();
    let pool=_voices.filter(x=>x.lang&&x.lang.toLowerCase().startsWith(base));
    if(!pool.length)pool=_voices;
    // 按声线偏好（女/男）优先匹配名称关键字
    if(gender==='female'||gender==='male'){
      const re=gender==='female'
        ? /female|woman|samantha|zira|victoria|karen|tessa|allison|ava|susan|linda|libby|moira|fiona|kate|emily|joanna|julie|leslie|marlene|mei|ting-ting|\bgoogle us english\b/i
        : /male|man|alex|david|fred|daniel|tom|george|rishi|\bgoogle uk english male\b|yuri|diego|jorge|juan|paul|ralph|richard|shaun|steven|arthur|mark|oskar/i;
      const hit=pool.find(x=>re.test(x.name||''));
      if(hit)return hit;
    }
    const v=pool.find(x=>x.lang&&x.lang.toLowerCase()===target.toLowerCase());
    return v||pool[0]||null;
  }
  // 移动端音频解锁：首次任意手势内唤醒 AudioContext（meSpeak 与 Web Speech 都受益）
  function unlockAudio(){
    if(_audioUnlocked)return;
    _audioUnlocked=true;
    try{ const Ctx=window.AudioContext||window.webkitAudioContext; if(Ctx){ const c=new Ctx(); if(c.state==='suspended')c.resume(); } }catch(e){}
    try{ if('speechSynthesis'in window){ const u=new SpeechSynthesisUtterance('');u.volume=0;window.speechSynthesis.speak(u);} }catch(e){}
  }
  ['touchend','click','pointerdown'].forEach(ev=>{
    window.addEventListener(ev,unlockAudio,{passive:true});
  });
  // meSpeak 兜底（英文单词，所有浏览器通用）
  function meSpeakFallback(text,lang){
    if(typeof meSpeak==='undefined'||!msEnReady)return false;
    if(!lang||/^en/i.test(lang)){
      try{
        // 女声变体 f1 + 提高音高；男声 m3 + 降低音高；默认不变体
        const variant = voicePref==='female'?'f1':(voicePref==='male'?'m3':'');
        const opts={voice:'en',speed:150,pitch: voicePref==='female'?62:(voicePref==='male'?40:50),volume:1};
        if(variant)opts.variant=variant;
        meSpeak.speak(text,opts); return true;
      }catch(e){ return false; }
    }
    return false;
  }
  function speak(text,lang){
    if(!text)return;
    const useLang=lang||'en-US';
    const gender = voicePref==='female'?'female':(voicePref==='male'?'male':null);
    // 1) 优先 Web Speech（Chrome/Edge/iOS 等支持良好的浏览器，音质更自然）
    if('speechSynthesis'in window){
      try{
        let spoke=false;
        if(window.speechSynthesis.speaking||window.speechSynthesis.pending)window.speechSynthesis.cancel();
        const u=new SpeechSynthesisUtterance(text);
        u.lang=useLang;u.rate=0.9;
        u.pitch= voicePref==='female'?1.15:(voicePref==='male'?0.85:1);
        const v=pickVoice(useLang,gender);if(v)u.voice=v;
        _curUtter=u;
        u.onstart=()=>{spoke=true;};
        u.onerror=()=>{ if(!spoke)meSpeakFallback(text,lang); };
        window.speechSynthesis.speak(u);
        // 部分浏览器 speechSynthesis 存在但永不触发 onstart（如 X5/华为内核）→ 超时降级到 meSpeak
        setTimeout(()=>{ if(!spoke)meSpeakFallback(text,lang); },700);
        return;
      }catch(e){ /* 落到下面 meSpeak */ }
    }
    // 2) 无 Web Speech 直接走 meSpeak
    meSpeakFallback(text,lang);
  }

  /* ============ 真人发音（优先） + 合成兜底 ============ */
  // 单词 → 音频文件名 key（与生成脚本一致：小写、非字母数字转下划线）
  function audioKey(w){ return (w||'').toLowerCase().replace(/[^a-z0-9]/g,'_'); }
  // 载入真人音清单（仅在打包了 audio/ 时存在）
  async function loadAudioManifest(){
    try{ const r=await fetch('audio/manifest.json',{cache:'force-cache'}); if(r&&r.ok){ audioManifest=await r.json(); } }catch(e){ audioManifest=null; }
  }
  // 播放单词：优先真人音（按当前口音），失败/缺失则退回合成音
  function playWordAudio(word){
    if(!word)return;
    const accent=accentPref||'us';
    const key=audioKey(word);
    let useAccent=null;
    if(audioManifest && audioManifest[key]){
      if(audioManifest[key][accent]) useAccent=accent;
      else if(accent==='us' && audioManifest[key].uk) useAccent='uk';   // 选定口音缺，则用另一种口音兜底
      else if(accent==='uk' && audioManifest[key].us) useAccent='us';
    } else {
      useAccent=accent; // 清单未就绪时直接试文件，失败再退回合成
    }
    if(useAccent){
      const url='audio/'+key+'__'+useAccent+'.mp3';
      const a=new Audio(); a.preload='auto'; a.src=url;
      let settled=false;
      a.addEventListener('playing',()=>{settled=true;});
      const fb=()=>{ if(!settled){ settled=true; speak(word,'en-US'); } };
      a.onerror=fb;
      try{ const p=a.play(); if(p&&p.catch)p.catch(fb); }catch(e){ fb(); }
      setTimeout(fb,1200); // 1.2s 内仍无播放则退回合成音
      return;
    }
    speak(word,'en-US');
  }

  async function importRows(rows,libraryName,source){
    const name=libraryName&&libraryName.trim()?libraryName.trim():('词库'+new Date().toLocaleDateString());
    const {records,skipped,format}=VocabCore.normalizeRows(rows,{libraryName:name});
    if(records.length===0){toast('未解析到有效单词，请检查格式');return null;}
    const libId=uid('lib');
    await putLib({id:libId,name,createdAt:Date.now(),source:source||'',format});
    await addWords(libId,records);
    state.curLibId=libId;updateIndicator();
    toast('已导入 '+records.length+' 词'+(skipped?('，跳过 '+skipped+' 空行'):'')+'（'+(format==='zhongkao'?'中考1600格式':'通用格式')+'）');
    return libId;
  }
  function xlsxToRows(ab){
    const wb=XLSX.read(ab,{type:'array'});
    const ws=wb.SheetNames.length?wb.Sheets[wb.SheetNames[0]]:null;
    if(!ws)return [];
    return XLSX.utils.sheet_to_json(ws,{header:1,defval:'',blankrows:false});
  }

  /* ============ 背诵 ============ */
  async function startStudy(){
    unlockAudio(); // 用户点击即解锁音频（iOS 必需）
    const lib=await getLib(state.curLibId);if(!lib)return;
    let words=await getWords(state.curLibId);
    const sel=state.groups.filter(g=>{const c=document.querySelector('#groupChips .chip[data-g="'+CSS.escape(g)+'"]');return c&&c.classList.contains('on');});
    if(sel.length)words=words.filter(w=>sel.includes(w.group_tag));
    let mode=getSeg('#segMode'),sort=getSeg('#segSort'),mem=getSeg('#segMem');
    if(mode==='wrong'){
      const prog=await getProgressForLib(state.curLibId);
      const wrong=new Set(prog.filter(p=>p.error_count>0).map(p=>p.wordId));
      const filtered=words.filter(w=>wrong.has(w.id));
      if(filtered.length===0){toast('本范围暂无错词，自动切换为全部背诵');mode='all';setSeg('#segMode','all');words=words;}
      else words=filtered;
    }
    if(sort==='random'){for(let i=words.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[words[i],words[j]]=[words[j],words[i]];}}
    else words.sort((a,b)=>(a.word_order||0)-(b.word_order||0));
    state.study={lib,words,idx:0,mode,sort,mem,correct:0,wrong:0,cur:null,prog:null};
    showView('study');renderStudy();
  }
  $('#startStudyBtn').addEventListener('click',startStudy);

  function renderStudy(){
    const s=state.study;if(!s)return;
    s.judged=false;
    if(s.idx>=s.words.length){renderSummary();return;}
    const w=s.words[s.idx];s.cur=w;
    const total=s.words.length;
    $('#studyHead').innerHTML='<span>'+esc(s.lib.name)+' · '+(s.mode==='wrong'?'仅错词':'全部')+'</span><span>'+(s.idx+1)+' / '+total+'</span>';
    $('#studyBar').style.width=((s.idx)/total*100)+'%';
    const body=$('#studyBody');
    let showText,subText,spoken,spokenLang;
    spoken=w.word_en; spokenLang='en-US'; // 核心：始终朗读英文单词本身，meSpeak 兜底保证所有浏览器出声
    if(s.mem==='en'){showText=w.word_en;subText='🔊 听单词发音，口头拼出英文并说出中文';}
    else{showText=w.word_cn;subText='🔊 听单词发音，口头拼出英文';}
    body.innerHTML=
      '<div class="study-word">'+esc(showText)+'</div>'+
      '<div class="study-sub">'+esc(subText)+'</div>'+
      '<div class="study-actions"><button class="btn ghost" id="speakBtn">🔊 播报</button></div>'+
      '<div class="study-actions">'+
        '<button class="btn bad" id="wrongBtn" style="flex:1.4">❌ 标记错误</button>'+
        '<button class="btn ok" id="nextBtn">✓ 认识</button>'+
      '</div>'+
      '<div class="detail" id="detail"></div>';
    $('#speakBtn').addEventListener('click',()=>playWordAudio(spoken));
    $('#wrongBtn').addEventListener('click',()=>judge(w,false));
    $('#nextBtn').addEventListener('click',()=>judge(w,true));

  }
  // 每个词只判一次：锁定按钮，避免“标记错误”后又被“下一个”重复计数
  function judge(w,isCorrect){
    const s=state.study;
    if(s.judged) return;
    s.judged=true;
    const wb=$('#wrongBtn'),nb=$('#nextBtn');
    if(wb)wb.disabled=true; if(nb)nb.disabled=true;
    if(isCorrect){ s.correct++; }
    else { s.wrong++; onWrongShow(w); }
    setTimeout(nextWord, isCorrect?350:1300);
  }
  async function onWrongShow(w){
    const s=state.study;
    const cnt=await bumpProgress(w.id,s.lib.id,1);

    d.innerHTML='<div style="font-weight:800;color:#b45309">⚠ 已标记错误（累计 '+cnt+' 次）</div>'+
      '<div style="margin-top:6px"><b>'+esc(w.word_en)+'</b> &nbsp; '+esc(w.word_cn)+'</div>'+ex;
    d.classList.add('show');
    playWordAudio(w.word_en);
  }

  /* ============ 统计 ============ */
  async function renderStats(){
    if(!state.curLibId)return;
    const lib=await getLib(state.curLibId);
    const words=await getWords(state.curLibId);
    const prog=await getProgressForLib(state.curLibId);
    const pmap={};prog.forEach(p=>pmap[p.wordId]=p);
    const wrongWords=words.filter(w=>(pmap[w.id]&&pmap[w.id].error_count>0));
    const totalErr=wrongWords.reduce((s,w)=>s+(pmap[w.id].error_count||0),0);
    $('#statCards').innerHTML=
      statCard(words.length,'总词数')+statCard(wrongWords.length,'错词数')+
      statCard(words.length?Math.round((words.length-wrongWords.length)/words.length*100)+'%':'-','掌握率')+
      statCard(totalErr,'错误总次数');
    // 各分组
    const gmap={};
    words.forEach(w=>{(gmap[w.group_tag]=gmap[w.group_tag]||{n:0,wn:0,err:0});gmap[w.group_tag].n++;});
    wrongWords.forEach(w=>{if(gmap[w.group_tag]){gmap[w.group_tag].wn++;gmap[w.group_tag].err+=(pmap[w.id].error_count||0);}});
    const gkeys=Object.keys(gmap).sort((a,b)=>{const na=parseInt((a.match(/\d+/)||[0])[0]),nb=parseInt((b.match(/\d+/)||[0])[0]);return na-nb||a.localeCompare(b);});
    let gh='<table><thead><tr><th>分组</th><th>词数</th><th>错词</th><th>错误次数</th><th>错误率</th><th></th></tr></thead><tbody>';
    gkeys.forEach(g=>{const m=gmap[g];const rate=m.n?Math.round(m.err/m.n*100):0;gh+='<tr><td>'+esc(g)+'</td><td>'+m.n+'</td><td>'+m.wn+'</td><td>'+m.err+'</td><td>'+rate+'%</td><td><div class="bar" style="width:70px"><i style="width:'+Math.min(100,rate)+'%"></i></div></td></tr>';});
    gh+='</tbody></table>';
    $('#statGroups').innerHTML=gkeys.length?gh:'<div class="empty">暂无数据</div>';
    // 排行
    const rank=wrongWords.slice().sort((a,b)=>(pmap[b.id].error_count||0)-(pmap[a.id].error_count||0)).slice(0,10);
    let rh='<table><thead><tr><th>单词</th><th>释义</th><th>错误次数</th></tr></thead><tbody>';
    rank.forEach(w=>{rh+='<tr><td><b>'+esc(w.word_en)+'</b></td><td>'+esc(w.word_cn)+'</td><td><span class="pill">'+(pmap[w.id].error_count||0)+'</span></td></tr>';});
    rh+='</tbody></table>';
    $('#statRank').innerHTML=rank.length?rh:'<div class="empty">还没有错词 🎉</div>';
  }
  function statCard(n,t){return '<div class="stat"><div class="n">'+n+'</div><div class="t">'+t+'</div></div>';}

  $('#expBtn').addEventListener('click',async()=>{

    const words=await getWords(libId);const prog=await getProgressForLib(libId);
    const pmap={};prog.forEach(p=>pmap[p.wordId]=p);
    let rows=words.map(w=>({word_en:w.word_en,word_cn:w.word_cn,group_tag:w.group_tag,word_order:w.word_order,unit_no:w.unit_no,error_count:pmap[w.id]?pmap[w.id].error_count:0,example_en:w.example_en,example_cn:w.example_cn}));
    if($('#expScope').value==='wrong')rows=rows.filter(r=>r.error_count>0);
    const sort=$('#expSort').value;
    if(sort==='error')rows.sort((a,b)=>b.error_count-a.error_count);
    else if(sort==='group')rows.sort((a,b)=>a.group_tag.localeCompare(b.group_tag)||(a.word_order||0)-(b.word_order||0));
    else rows.sort((a,b)=>(a.word_order||0)-(b.word_order||0));
    const fmt=$('#expFmt').value;
    const content=fmt==='json'?VocabCore.buildJson(rows):VocabCore.buildCsv(rows);
    const blob=new Blob([content],{type:fmt==='json'?'application/json':'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');
    const lib=await getLib(libId);
    a.href=url;a.download=(lib?lib.name:'词库')+'_导出.'+(fmt==='json'?'json':'csv');a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast('已导出 '+rows.length+' 条');
  });

  /* ============ 打印 ============ */
  $('#prtBtn').addEventListener('click',async()=>{
    const libId=$('#prtLib').value;if(!libId){toast('请先导入词库');return;}
    const lib=await getLib(libId);const words=await getWords(libId);
    let rows=words.slice();
    if($('#prtScope').value==='wrong'){const prog=await getProgressForLib(libId);const pmap={};prog.forEach(p=>pmap[p.wordId]=p);rows=rows.filter(w=>pmap[w.id]&&pmap[w.id].error_count>0);}
    rows.sort((a,b)=>(a.word_order||0)-(b.word_order||0));
    let html='<div class="pv"><h1>'+esc(lib.name)+' — 单词表</h1><div class="pm">共 '+rows.length+' 词 · 打印时间 '+new Date().toLocaleString()+'</div><table><thead><tr><th>序号</th><th>英文</th><th>中文释义</th><th>分组</th></tr></thead><tbody>';
    rows.forEach((w,i)=>{html+='<tr><td>'+(i+1)+'</td><td>'+esc(w.word_en)+'</td><td>'+esc(w.word_cn)+'</td><td>'+esc(w.group_tag)+'</td></tr>';});
    html+='</tbody></table></div>';
    $('#print-root').innerHTML=html;
    setTimeout(()=>window.print(),50);
  });

  /* ============ 看板 ============ */
  async function renderDash(){
    const libId=$('#dashLib').value;const body=$('#dashBody');
    if(!libId){body.innerHTML='<div class="empty">请选择词库</div>';return;}
    const words=await getWords(libId);const prog=await getProgressForLib(libId);
    const pmap={};prog.forEach(p=>pmap[p.wordId]=p);
    const wrong=words.filter(w=>pmap[w.id]&&pmap[w.id].error_count>0);
    body.innerHTML='<div class="stat-cards">'+statCard(words.length,'词数')+statCard(wrong.length,'错词')+'<div class="stat"><div class="n">'+wrong.reduce((s,w)=>s+(pmap[w.id].error_count||0),0)+'</div><div class="t">错误总次数</div></div></div>';
    let h='<table><thead><tr><th>英文</th><th>中文</th><th>分组</th><th>错误</th><th>例句(英)</th><th>例句(中)</th></tr></thead><tbody>';
    words.forEach(w=>{h+='<tr><td>'+esc(w.word_en)+'</td><td>'+esc(w.word_cn)+'</td><td>'+esc(w.group_tag)+'</td><td>'+(pmap[w.id]?pmap[w.id].error_count:0)+'</td><td>'+esc(w.example_en)+'</td><td>'+esc(w.example_cn)+'</td></tr>';});
    h+='</tbody></table>';
    body.innerHTML+=h;
  }
  $('#dashLib').addEventListener('change',renderDash);

  /* ============ PWA ============ */
  if('serviceWorker'in navigator && location.protocol.indexOf('http')===0){
    window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
  }

  /* ============ 启动 ============ */
  (async function init(){
    try{await openDB();}catch(e){console.error(e);}
    loadAudioManifest();
    const libs=await getLibs();
    if(libs.length){state.curLibId=libs[0].id;}
    updateIndicator();
    showView('libraries');
  })();
  </script>
</body>
</html>
